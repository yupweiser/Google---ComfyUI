events { worker_connections 1024; }

http {
    server {
        listen 8080;

        # Increase upload size for large checkpoints/models if needed
        client_max_body_size 10G;

        # 1. Route /terminal/ to ttyd (running on port 7681)
        location /terminal/ {
            proxy_pass http://127.0.0.1:7681/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # 2. Route everything else or /comfy/ to ComfyUI (running on port 8188)
        # Note: ComfyUI expects WebSockets too, hence the upgrade headers
        location / {
            proxy_pass http://127.0.0.1:8188/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }
    }
}
